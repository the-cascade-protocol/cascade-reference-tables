name: try the picker

on:
  pull_request:

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: the vocabulary, in place of the commit vocabulary.json pins
        id: vocabulary
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/pick@main
        with:
          repository: the-cascade-protocol/cascade-vocabulary
          checkout: cascade-vocabulary
      - name: the runtime's files
        id: runtime
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/pick@main
        with:
          repository: the-cascade-protocol/cascade-runtime-js
          checkout: cascade-runtime-js
      - name: what was picked
        env:
          VOCABULARY: ${{ steps.vocabulary.outputs.path }} ${{ steps.vocabulary.outputs.commit }} ${{ steps.vocabulary.outputs.how }}
          RUNTIME: ${{ steps.runtime.outputs.path }} ${{ steps.runtime.outputs.commit }} ${{ steps.runtime.outputs.how }}
        run: |
          set -euo pipefail
          echo "vocabulary: ${VOCABULARY}"
          echo "runtime: ${RUNTIME}"
          test -f cascade-vocabulary/ontologies/cascade.ttl
          git -C cascade-vocabulary log --oneline -3
          git -C cascade-runtime-js log --oneline -3

  packages:
    runs-on: ubuntu-latest
    steps:
      - name: the runtime's package
        id: runtime
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/pick@main
        with:
          repository: the-cascade-protocol/cascade-runtime-js
          package: cascade-runtime-*.tgz
      - name: the sandbox's package
        id: sandbox
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/pick@main
        with:
          repository: the-cascade-protocol/cascade-sandbox
          package: '*.tgz'
      - name: the tables' package
        id: tables
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/pick@main
        with:
          repository: the-cascade-protocol/cascade-reference-tables
          package: cascade-reference-tables-*.tgz
      - name: what was picked
        env:
          RUNTIME: ${{ steps.runtime.outputs.path }} ${{ steps.runtime.outputs.commit }} ${{ steps.runtime.outputs.how }}
          SANDBOX: ${{ steps.sandbox.outputs.path }} ${{ steps.sandbox.outputs.commit }} ${{ steps.sandbox.outputs.how }}
          TABLES: ${{ steps.tables.outputs.path }} ${{ steps.tables.outputs.commit }} ${{ steps.tables.outputs.how }}
          RUNTIME_PATH: ${{ steps.runtime.outputs.path }}
        run: |
          set -euo pipefail
          echo "runtime: ${RUNTIME}"
          echo "sandbox: ${SANDBOX}"
          echo "tables: ${TABLES}"
          tar -xzOf "${RUNTIME_PATH}" package/package.json | jq -r '.name + " " + .version'
